<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TomaTuCurso | Aprende más, paga menos</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font:16px system-ui}header,main,footer{padding:24px max(5%,calc((100% - 1100px)/2))}header{background:#075e51;color:white;display:flex;justify-content:space-between;align-items:center}header strong{font-size:24px}h1{font-size:clamp(32px,6vw,60px);margin:0} .hero{background:#e0f0eb;padding:40px 24px;border-radius:24px;margin-bottom:24px}button,input,select{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px}button{cursor:pointer;background:#075e51;color:white;border:0}button:disabled{opacity:.5;cursor:not-allowed}.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}article,aside{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:20px}article .cover{background:#e0f0eb;color:#075e51;border-radius:12px;padding:24px;font-size:42px}article button{width:100%}aside{margin-top:24px}li{padding:8px 0}li button{margin-left:12px;padding:6px 10px}small{color:#475569}header button{background:white;color:#075e51}footer{color:#475569}</style><header><strong>TomaTuCurso</strong><button onclick="document.querySelector('aside').scrollIntoView({behavior:'smooth'})">Carrito <span id="count">0</span></button></header><main><section class="hero"><h1>Aprende más, paga menos.</h1><p>Cursos y manuales digitales de electricidad y automatización.</p></section><div class="filters"><input id="search" placeholder="Buscar productos" aria-label="Buscar productos"><select id="category" aria-label="Categoría"><option>Todos</option><option>Manuales</option><option>Cursos</option></select><select id="currency" aria-label="Moneda"><option value="PEN">Soles (PEN)</option><option value="USD">Dólares (USD)</option></select></div><p><small>Catálogo preliminar: precios sujetos a confirmación.</small></p><div class="grid" id="catalog"></div><aside><h2>Mi carrito</h2><ul id="items"></ul><h3 id="total"></h3><button id="buy">Comprar por WhatsApp</button><p id="notice" role="status"></p><small>Pago y entrega coordinados por WhatsApp. No se realiza ningún cobro en esta página.</small></aside></main><footer>TomaTuCurso · Formación digital</footer><script>const WHATSAPP='51935645859';const products=[{id:1,n:'PLC Educativo con Arduino',c:'Manuales',p:7,u:3,i:'⚙️',d:'Introducción a la automatización educativa con Arduino.'},{id:2,n:'Lógica Cableada',c:'Manuales',p:7,u:3,i:'⚡',d:'Circuitos eléctricos de mando y fuerza.'},{id:3,n:'Electricidad Domiciliaria',c:'Manuales',p:5,u:2,i:'⌂',d:'Fundamentos de instalaciones eléctricas.'},{id:4,n:'Electricidad Industrial',c:'Cursos',p:25,u:10,i:'▤',d:'Curso grabado de electricidad industrial.'},{id:5,n:'PLC con Arduino',c:'Cursos',p:29,u:12,i:'▣',d:'Curso grabado de automatización educativa.'}];let cart=[];try{const saved=JSON.parse(localStorage.getItem('ttc-cart')||'[]');if(Array.isArray(saved))cart=[...new Set(saved)].filter(id=>products.some(p=>p.id===id))}catch{}const $=id=>document.getElementById(id);const money=p=>new Intl.NumberFormat('es-PE',{style:'currency',currency:$('currency').value}).format(p);const price=p=>$('currency').value==='PEN'?p.p:p.u;function render(){const q=$('search').value.toLowerCase();$('catalog').innerHTML=products.filter(p=>p.n.toLowerCase().includes(q)&&($('category').value==='Todos'||p.c===$('category').value)).map(p=>'<article><div class="cover">'+p.i+'</div><small>'+p.c+'</small><h3>'+p.n+'</h3><p>'+p.d+'</p><h3>'+money(price(p))+'</h3><button onclick="add('+p.id+')" '+(cart.includes(p.id)?'disabled':'')+'>'+(cart.includes(p.id)?'Agregado':'Agregar al carrito')+'</button></article>').join('');const chosen=products.filter(p=>cart.includes(p.id));$('items').innerHTML=chosen.map(p=>'<li>'+p.n+' — '+money(price(p))+' <button aria-label="Quitar '+p.n+'" onclick="remove('+p.id+')">Quitar</button></li>').join('')||'<li>Tu carrito está vacío.</li>';$('count').textContent=chosen.length;$('total').textContent='Total: '+money(chosen.reduce((s,p)=>s+price(p),0));$('buy').disabled=!chosen.length;try{localStorage.setItem('ttc-cart',JSON.stringify(cart))}catch{}}function add(id){if(!cart.includes(id))cart.push(id);render()}function remove(id){cart=cart.filter(x=>x!==id);render()}['search','category','currency'].forEach(id=>$(id).addEventListener('input',render));$('buy').onclick=()=>{if(!/^\d{8,15}$/.test(WHATSAPP)){$('notice').textContent='WhatsApp comercial pendiente de configuración.';return}const chosen=products.filter(p=>cart.includes(p.id));const msg='Hola, quiero comprar en TomaTuCurso:\n'+chosen.map(p=>p.n+' — '+money(price(p))).join('\n')+'\n'+$('total').textContent+'\n¿Me envían los medios de pago?';location.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg)};render();</script></html>
